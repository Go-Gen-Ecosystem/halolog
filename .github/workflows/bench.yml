# @author Admilson B. F. Cossa
#
# Benchmark gate on a quiet Linux runner. Two jobs:
#   - alloc-guard (HARD GATE): every committed zero-allocation guard must hold
#     on linux/amd64 — a single hot-path allocation fails the build.
#   - bench (REPORT): runs the co-measured multi-logger comparison and the
#     HaloLog-specific suites, publishes the numbers to the job summary and as
#     an artifact so regressions are visible per commit. Reported, not gated:
#     shared runners have noisy absolute timings, so gating is on allocations
#     (deterministic), while ns/op trends are reviewed by humans.
name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alloc-guard:
    name: allocation contracts / ${{ matrix.os }} / Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.24.0', stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Zero-allocation guards
        shell: bash
        env:
          GOWORK: off
        run: |
          go test ./core -run 'TestZeroAlloc' -count=1 -v
          # Allocation budgets describe uninstrumented code. Race correctness
          # runs separately in CI; regex budget tests use a !race build tag.
          go test ./masking -run 'Test.*Alloc' -count=1 -v
          go test ./adapters/formatters/json -run 'TestHeaderZeroAlloc|TestFormatterGolden|TestDirectMatchesFormat' -count=1 -v

  bench:
    name: co-measured benchmarks (report)
    runs-on: ubuntu-latest
    needs: alloc-guard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: true
      - name: Run benchmark suite
        working-directory: benchmarks
        env:
          GOWORK: off
        run: |
          go test -run=XXX \
            -bench='BenchmarkDefaults|BenchmarkNoTimestamp|BenchmarkClockCost|BenchmarkAsyncCallerLatency|BenchmarkKeyed|BenchmarkKeyIsolation' \
            -benchmem -benchtime=1s -count=6 -cpu=1 -timeout=30m | tee bench.txt
      - name: Publish to job summary
        working-directory: benchmarks
        run: |
          {
            echo '### HaloLog benchmarks (ubuntu-latest, count=6, cpu=1)'
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results-${{ github.sha }}
          path: benchmarks/bench.txt
