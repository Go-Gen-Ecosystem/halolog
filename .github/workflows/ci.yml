# @author Admilson B. F. Cossa
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    # Pin the reusable workflow so CI behavior cannot change without review.
    uses: go-gen-ecosystem/.github/.github/workflows/reusable-go-ci.yml@8566e8c1160036afa595a95fa4046720418ebeb4
    with:
      coverage-threshold: 60

  otelbridge:
    name: otelbridge / ${{ matrix.core }} core / Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: [local, published]
        go: ['1.24.0', stable]
    permissions:
      contents: read
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOFLAGS: ''
      GOTOOLCHAIN: local
      # Resolve public dependencies independently of developer machines and
      # setup-go module caches. Sum verification must remain enabled.
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Verify local integration or published dependency
        env:
          CORE_MODE: ${{ matrix.core }}
          GOMODCACHE: ${{ runner.temp }}/otel-module-cache
        run: |
          bash scripts/verify-otelbridge.sh "$CORE_MODE"
          git diff --exit-code -- otelbridge/go.mod otelbridge/go.sum
