# Per-module release workflow. Copy to <module>/.github/workflows/release.yml.
# Runs goreleaser on v* tags (libraries publish changelog+release; CLIs also build binaries).
#
# @author Admilson B. F. Cossa
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOWORK: off
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      # goreleaser diffs the changelog against the nearest tag of any kind,
      # which can be another module's (otelbridge/v*). Name the previous
      # release tag of this module instead; a first release has none.
      - name: Find the previous release tag
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            echo "GORELEASER_PREVIOUS_TAG=$prev" >> "$GITHUB_ENV"
          fi
          echo "previous release tag: ${prev:-none}"
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
